<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SWUI Inventory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .modal-panel {
      width: 640px;
      background: #1a202c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #a0aec0;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.1s;
    }
    .close-btn:hover { color: #fff; }
    .search-input {
      width: 100%;
      background: #2d3748;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: #4299e1;
      box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-height: 320px;
      overflow-y: auto;
    }
    .slot {
      aspect-ratio: 1;
      background: #2d3748;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .slot:hover {
      background: #4a5568;
      border-color: #63b3ed;
      transform: translateY(-2px);
    }
    .slot-name {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 0 4px;
    }
    .slot-qty {
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 11px;
      color: #a0aec0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="modal-panel">
    <div class="header">
      <div class="title">INVENTORY</div>
      <button class="close-btn" id="btn-close">&times;</button>
    </div>

    <!-- Demonstrates real text input forwarding to CEF -->
    <input type="text" class="search-input" id="search-box" placeholder="Filter items (Keyboard input supported)...">

    <div class="grid" id="item-grid">
      <div class="slot" data-item="plasma_rifle">
        <span class="slot-name">Plasma Rifle</span>
        <span class="slot-qty">x1</span>
      </div>
      <div class="slot" data-item="medkit">
        <span class="slot-name">Medkit</span>
        <span class="slot-qty">x3</span>
      </div>
      <div class="slot" data-item="grenade">
        <span class="slot-name">Frag Grenade</span>
        <span class="slot-qty">x5</span>
      </div>
      <div class="slot" data-item="shield_battery">
        <span class="slot-name">Shield Cell</span>
        <span class="slot-qty">x2</span>
      </div>
    </div>
  </div>

  <script>
    // Helper to send navigation events to Unreal Engine
    function sendToUnreal(tagName, payload) {
      var msg = JSON.stringify({
        type: "navigation",
        tag: tagName,
        payload: payload || {}
      });

      if (window.__SWUI__ && window.__SWUI__.send) {
        window.__SWUI__.send(msg);
      } else if (window.cefQuery) {
        window.cefQuery({ request: msg });
      } else {
        console.log("[SWUI Sim] Sent to Unreal:", msg);
      }
    }

    // Close button sends event to Unreal to deactivate this document
    document.getElementById('btn-close').addEventListener('click', function() {
      sendToUnreal("UI.Navigation.CloseInventory");
    });

    // Item slots emit equip events
    document.querySelectorAll('.slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        var itemId = this.getAttribute('data-item');
        sendToUnreal("UI.Inventory.EquipItem", { itemId: itemId });
      });
    });
  </script>
</body>
</html>
