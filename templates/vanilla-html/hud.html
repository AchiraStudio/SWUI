<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SWUI HUD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      user-select: none;
      color: #fff;
    }
    .hud-bottom-left {
      position: absolute;
      bottom: 40px;
      left: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bar-container {
      background: rgba(10, 15, 25, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 16px;
      width: 280px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #a0aec0;
    }
    .bar-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 5px;
      transition: width 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .health-fill {
      background: linear-gradient(90deg, #e53e3e, #f56565);
      box-shadow: 0 0 12px rgba(229, 62, 62, 0.6);
    }
    .shield-fill {
      background: linear-gradient(90deg, #3182ce, #63b3ed);
      box-shadow: 0 0 12px rgba(49, 130, 206, 0.6);
    }
    .hud-bottom-right {
      position: absolute;
      bottom: 40px;
      right: 40px;
      background: rgba(10, 15, 25, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 16px 24px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .ammo-current {
      font-size: 36px;
      font-weight: 800;
      color: #ecc94b;
      line-height: 1;
    }
    .ammo-max {
      font-size: 16px;
      font-weight: 600;
      color: #718096;
    }
  </style>
</head>
<body>
  <!-- Bottom Left: Vitals -->
  <div class="hud-bottom-left">
    <div class="bar-container">
      <div class="bar-label">
        <span>Health</span>
        <span id="health-val">100</span>
      </div>
      <div class="bar-track">
        <div id="health-bar" class="bar-fill health-fill" style="width: 100%;"></div>
      </div>
    </div>

    <div class="bar-container">
      <div class="bar-label">
        <span>Shield</span>
        <span id="shield-val">75</span>
      </div>
      <div class="bar-track">
        <div id="shield-bar" class="bar-fill shield-fill" style="width: 75%;"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Right: Ammo -->
  <div class="hud-bottom-right">
    <span id="ammo-cur" class="ammo-current">30</span>
    <span class="ammo-max">/ <span id="ammo-max">90</span></span>
  </div>

  <script>
    // Pure Vanilla JS listener for SWUI 3.0 state changes
    function updateState(key, val) {
      if (key === 'Health' || key === 'PlayerHealth') {
        const hp = Math.max(0, Math.min(100, Number(val)));
        document.getElementById('health-bar').style.width = hp + '%';
        document.getElementById('health-val').textContent = Math.round(hp);
      } else if (key === 'Shield' || key === 'PlayerShield') {
        const sp = Math.max(0, Math.min(100, Number(val)));
        document.getElementById('shield-bar').style.width = sp + '%';
        document.getElementById('shield-val').textContent = Math.round(sp);
      } else if (key === 'Ammo') {
        document.getElementById('ammo-cur').textContent = val;
      } else if (key === 'MaxAmmo') {
        document.getElementById('ammo-max').textContent = val;
      }
    }

    // Listens to atomic state batches or single property changes
    document.addEventListener('swui:stateChange', function(e) {
      if (e.detail) {
        updateState(e.detail.key, e.detail.value);
      }
    });

    // Optional batch hook if provided by SWUI host
    window.__SWUI__ = window.__SWUI__ || {};
    window.__SWUI__._batch = function(batch) {
      for (var k in batch) {
        updateState(k, batch[k]);
      }
    };
  </script>
</body>
</html>
