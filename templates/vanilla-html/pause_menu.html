<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SWUI Pause Menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: rgba(10, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      color: #fff;
    }
    .menu-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.2em;
      margin-bottom: 32px;
      text-transform: uppercase;
      color: #e2e8f0;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 280px;
    }
    .menu-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #edf2f7;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }
    .menu-btn:hover {
      background: rgba(66, 153, 225, 0.25);
      border-color: #4299e1;
      transform: scale(1.03);
      box-shadow: 0 0 16px rgba(66, 153, 225, 0.4);
    }
    .menu-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="menu-title">PAUSED</div>

  <div class="btn-stack">
    <button class="menu-btn" id="btn-resume">RESUME</button>
    <button class="menu-btn" id="btn-options">OPTIONS</button>
    <button class="menu-btn" id="btn-quit">QUIT TO MENU</button>
  </div>

  <script>
    function sendToUnreal(tagName) {
      var msg = JSON.stringify({
        type: "navigation",
        tag: tagName,
        payload: {}
      });

      if (window.__SWUI__ && window.__SWUI__.send) {
        window.__SWUI__.send(msg);
      } else if (window.cefQuery) {
        window.cefQuery({ request: msg });
      } else {
        console.log("[SWUI Sim] Sent to Unreal:", msg);
      }
    }

    document.getElementById('btn-resume').addEventListener('click', function() {
      sendToUnreal("UI.Menu.Resume");
    });
    document.getElementById('btn-options').addEventListener('click', function() {
      sendToUnreal("UI.Menu.Options");
    });
    document.getElementById('btn-quit').addEventListener('click', function() {
      sendToUnreal("UI.Menu.Quit");
    });
  </script>
</body>
</html>
