<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FP26 — Living Match Engine · v5 (attributes · personalities · playstyles · managers)</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d100e;
            --panel: #141814;
            --panel2: #101411;
            --hair: #262c26;
            --hair2: #1c221c;
            --txt: #e7e4da;
            --dim: #8b9184;
            --faint: #5a6156;
            --amber: #e3b341;
            --mono: 'IBM Plex Mono', monospace;
            --cond: 'Barlow Condensed', sans-serif
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--txt);
            font-family: var(--cond);
            overflow: hidden
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh
        }

        header {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 0 18px;
            height: 58px;
            border-bottom: 1px solid var(--hair)
        }

        .brand {
            display: flex;
            flex-direction: column;
            line-height: 1;
            gap: 3px;
            min-width: 130px
        }

        .brand b {
            font-weight: 700;
            font-size: 19px;
            letter-spacing: .06em
        }

        .brand span {
            font-size: 9px;
            letter-spacing: .3em;
            color: var(--dim);
            text-transform: uppercase
        }

        .scorebug {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 auto
        }

        .sb-team {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 19px;
            letter-spacing: .08em
        }

        .kit {
            width: 11px;
            height: 16px;
            border-radius: 2px;
            flex: 0 0 auto
        }

        .sb-score {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 22px;
            background: var(--panel2);
            border: 1px solid var(--hair);
            padding: 2px 12px;
            border-radius: 3px
        }

        .sb-mid {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.15;
            min-width: 96px
        }

        .sb-clock {
            font-family: var(--mono);
            font-size: 18px;
            font-weight: 600
        }

        .sb-half {
            font-size: 10px;
            letter-spacing: .3em;
            color: var(--dim)
        }

        .sb-xg {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--dim);
            min-width: 150px;
            text-align: center
        }

        .sb-xg b {
            color: var(--txt);
            font-weight: 500
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto
        }

        .ibtn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 4px;
            color: var(--txt);
            cursor: pointer
        }

        .ibtn:hover {
            background: #1d231d;
            border-color: #3a423a
        }

        .ibtn.on {
            border-color: var(--amber);
            color: var(--amber)
        }

        .ibtn svg {
            width: 15px;
            height: 15px;
            fill: currentColor
        }

        .seg {
            display: flex;
            border: 1px solid var(--hair);
            border-radius: 4px;
            overflow: hidden
        }

        .seg button {
            background: var(--panel);
            border: 0;
            color: var(--dim);
            font-family: var(--mono);
            font-size: 11px;
            padding: 9px 10px;
            cursor: pointer;
            border-right: 1px solid var(--hair)
        }

        .seg button:last-child {
            border-right: 0
        }

        .seg button.on {
            background: #232a23;
            color: var(--txt)
        }

        main {
            display: flex;
            flex: 1;
            min-height: 0
        }

        #stage {
            flex: 1;
            min-width: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(120% 90% at 50% 40%, #11151233 0%, #0d100e88 70%)
        }

        canvas {
            display: block
        }

        #side {
            width: 352px;
            flex: 0 0 auto;
            border-left: 1px solid var(--hair);
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--panel2)
        }

        #ticker {
            padding: 10px 14px;
            border-bottom: 1px solid var(--hair);
            min-height: 52px;
            display: flex;
            gap: 10px;
            align-items: baseline
        }

        #ticker .min {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--amber);
            flex: 0 0 auto
        }

        #ticker .txt {
            font-size: 15px;
            line-height: 1.3
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--hair)
        }

        .tabs button {
            flex: 1;
            background: none;
            border: 0;
            border-bottom: 2px solid transparent;
            color: var(--dim);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: .22em;
            padding: 11px 0;
            cursor: pointer
        }

        .tabs button.on {
            color: var(--txt);
            border-bottom-color: var(--amber)
        }

        .tabpane {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: none
        }

        .tabpane.on {
            display: block
        }

        .tabpane::-webkit-scrollbar {
            width: 8px
        }

        .tabpane::-webkit-scrollbar-thumb {
            background: #2a312a;
            border-radius: 4px
        }

        #feed {
            padding: 6px 0
        }

        .fe {
            display: flex;
            gap: 10px;
            padding: 7px 14px;
            border-bottom: 1px solid var(--hair2);
            align-items: baseline
        }

        .fe .min {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--dim);
            flex: 0 0 34px
        }

        .fe .txt {
            font-size: 14.5px;
            line-height: 1.32;
            flex: 1
        }

        .fe.major .txt {
            font-weight: 600
        }

        .fe .bar {
            width: 3px;
            flex: 0 0 auto;
            align-self: stretch;
            border-radius: 2px
        }

        #statsPane {
            padding: 14px
        }

        .strow {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            font-family: var(--mono);
            font-size: 12px
        }

        .strow .l {
            flex: 1;
            text-align: right;
            padding-right: 12px
        }

        .strow .c {
            flex: 0 0 118px;
            text-align: center;
            color: var(--faint);
            font-family: var(--cond);
            font-size: 11px;
            letter-spacing: .18em;
            text-transform: uppercase
        }

        .strow .r {
            flex: 1;
            padding-left: 12px
        }

        .pb {
            height: 4px;
            background: #232923;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-bottom: 12px
        }

        .pb i {
            position: absolute;
            top: 0;
            bottom: 0
        }

        .stitle {
            font-weight: 600;
            font-size: 12px;
            letter-spacing: .3em;
            color: var(--dim);
            text-transform: uppercase;
            margin: 18px 0 10px;
            border-bottom: 1px solid var(--hair2);
            padding-bottom: 6px
        }

        .stitle:first-child {
            margin-top: 0
        }

        #tacticsPane {
            padding: 14px
        }

        .tcard {
            border: 1px solid var(--hair);
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 14px;
            background: var(--panel)
        }

        .tcard h4 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: .1em;
            margin-bottom: 3px
        }

        .tcard .style {
            font-size: 11px;
            color: var(--dim);
            letter-spacing: .14em;
            text-transform: uppercase;
            margin-bottom: 10px
        }

        .mgrrow {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--dim);
            margin-bottom: 8px;
            letter-spacing: .04em
        }

        .mgrrow b {
            color: #e3b341;
            font-weight: 500
        }

        .trow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px
        }

        .dug{display:flex;gap:6px;margin-top:8px}
        .dug button{flex:1;background:#1a1810;border:1px solid #3a3420;color:#e3b341;font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:6px 0;border-radius:3px;cursor:pointer}
        .dug button:hover{background:#241f12}
        .dug button:disabled{opacity:.35;cursor:default}

        .trow label {
            flex: 0 0 78px;
            font-size: 11px;
            letter-spacing: .16em;
            color: var(--dim);
            text-transform: uppercase
        }

        .trow select {
            flex: 1;
            background: #0f130f;
            border: 1px solid var(--hair);
            color: var(--txt);
            font-family: var(--mono);
            font-size: 11px;
            padding: 6px 8px;
            border-radius: 3px;
            outline: none;
            cursor: pointer
        }

        .note {
            font-size: 11px;
            color: var(--faint);
            font-family: var(--mono);
            line-height: 1.5
        }

        #inspector {
            border-top: 1px solid var(--hair);
            padding: 12px 14px;
            max-height: 42%;
            overflow-y: auto;
            flex: 0 1 auto;
            background: var(--panel)
        }

        #inspector .empty {
            color: var(--faint);
            font-size: 13px
        }

        .match-facts {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 8px 10px;
            margin: 8px 0;
        }
        .mf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding-bottom: 5px;
            margin-bottom: 6px;
        }
        .mf-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--amber);
            text-transform: uppercase;
        }
        .mf-rating {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            color: #0f172a;
        }
        .mf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
        }
        .mf-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .mf-cat {
            font-size: 9px;
            letter-spacing: 0.06em;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 1px;
        }
        .mf-row {
            font-family: var(--mono);
            font-size: 10.5px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        .mf-row b {
            color: #f8fafc;
            font-weight: 600;
        }
        .insp-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 2px
        }

        .insp-head b {
            font-size: 17px;
            font-weight: 600
        }

        .insp-head .role {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--amber);
            letter-spacing: .2em
        }

        .insp-head .no {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--dim)
        }

        .insp-state {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--dim);
            margin: 6px 0 8px;
            line-height: 1.7
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px
        }

        .chip {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .08em;
            color: #e3b341;
            border: 1px solid #3a3420;
            border-radius: 3px;
            padding: 2px 5px;
            background: #1a1810
        }

        .attrgrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 16px;
            margin-bottom: 8px
        }

        .arow {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 10px
        }

        .arow span {
            flex: 0 0 46px;
            color: var(--dim)
        }

        .arow .pb {
            flex: 1;
            height: 3px;
            margin-bottom: 0
        }

        .arow b {
            flex: 0 0 26px;
            text-align: right;
            font-weight: 500
        }

        .utilrow {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 10px;
            margin-bottom: 4px
        }

        .utilrow span {
            flex: 0 0 118px;
            color: var(--dim)
        }

        .utilrow .pb {
            flex: 1;
            height: 4px;
            margin-bottom: 0
        }

        .utilrow b {
            flex: 0 0 34px;
            text-align: right
        }

        .banner {
            position: absolute;
            left: 50%;
            top: 14%;
            transform: translateX(-50%) translateY(-14px);
            opacity: 0;
            transition: all .3s;
            pointer-events: none;
            background: #101410f0;
            border: 1px solid var(--hair);
            border-left: 3px solid var(--amber);
            padding: 14px 34px;
            text-align: center;
            border-radius: 4px;
            backdrop-filter: blur(4px)
        }

        .banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }

        .banner .b1 {
            font-weight: 700;
            font-size: 34px;
            letter-spacing: .14em;
            line-height: 1
        }

        .banner .b2 {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--dim);
            margin-top: 6px;
            letter-spacing: .12em
        }

        #ftOverlay {
            position: absolute;
            inset: 0;
            background: #0c0f0cec;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px)
        }

        #ftOverlay.show {
            display: flex
        }

        .ftcard {
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 6px;
            padding: 30px 40px;
            width: min(480px, 92%);
            max-height: 88%;
            overflow-y: auto
        }

        .ftcard h2 {
            font-weight: 700;
            font-size: 26px;
            letter-spacing: .16em;
            margin-bottom: 4px
        }

        .ftcard .sub {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--dim);
            letter-spacing: .14em;
            margin-bottom: 20px
        }

        .ftrow {
            display: flex;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 12px;
            padding: 7px 0;
            border-bottom: 1px solid var(--hair2)
        }

        .ftrow span:first-child {
            color: var(--dim)
        }

        .motm {
            margin: 18px 0;
            padding: 12px;
            border: 1px solid var(--hair);
            border-radius: 4px;
            background: var(--panel2)
        }

        .motm .lab {
            font-size: 10px;
            letter-spacing: .3em;
            color: var(--amber);
            text-transform: uppercase;
            margin-bottom: 5px
        }

        .motm b {
            font-size: 18px
        }

        .motm .rt {
            font-family: var(--mono);
            color: var(--dim);
            font-size: 11px;
            margin-top: 3px
        }

        .ftbtns {
            display: flex;
            gap: 10px;
            margin-top: 18px
        }

        .btn {
            flex: 1;
            background: #1d231d;
            border: 1px solid #39413a;
            color: var(--txt);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: .18em;
            padding: 11px 0;
            border-radius: 4px;
            cursor: pointer
        }

        .btn:hover {
            background: #262e26
        }

        .btn.pri {
            background: var(--amber);
            border-color: var(--amber);
            color: #141104
        }

        #simbar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: #20261f;
            display: none
        }

        #simbar i {
            display: block;
            height: 100%;
            background: var(--amber);
            width: 0%
        }

        @media(max-width:960px) {
            main {
                flex-direction: column;
                overflow-y: auto
            }

            #stage {
                min-height: 52vh
            }

            #side {
                width: 100%;
                border-left: 0;
                border-top: 1px solid var(--hair)
            }

            body {
                overflow: auto
            }
        }
    
/* ── presentation sequences ── */
#seqLayer{position:absolute;inset:0;display:none;z-index:6;cursor:pointer}
#seqLayer.on{display:block}
.seqCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(16px);opacity:0;transition:all .5s cubic-bezier(.2,.9,.3,1);background:linear-gradient(160deg,#101411f2,#0b0e0cf5);border:1px solid var(--hair);border-top:2px solid var(--amber);border-radius:6px;padding:22px 30px;box-shadow:0 18px 60px #000a;backdrop-filter:blur(6px)}
.seqCard.in{opacity:1;transform:translate(-50%,-50%)}
.wordmark{font-weight:700;font-style:italic;font-size:40px;letter-spacing:.12em;text-align:center;line-height:1;margin-bottom:10px}
.scoreline{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
.bigscore{font-family:var(--mono);font-weight:600;font-size:40px;min-width:130px;text-align:center}
.crest{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.crest i{position:absolute;inset:0;border-radius:50%;clip-path:inset(0 0 0 50%)}
.crest b{position:relative;font-family:var(--mono);font-size:11px;color:#10130f;text-shadow:0 0 3px #ffffff88;z-index:1}
.ss-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;margin-bottom:2px}
.ss-row span{color:var(--faint);letter-spacing:.14em}
.ss-bar{height:4px;background:#20261f;border-radius:2px;overflow:hidden;margin-bottom:9px;position:relative}
.ss-bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .9s cubic-bezier(.2,.8,.3,1)}
.luCard{display:flex;gap:14px;align-items:stretch}
.luSide{flex:1;min-width:230px;background:#0d100ee8;border:1px solid var(--hair);border-radius:5px;padding:12px 14px}
.luHead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.luForm{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--amber);border:1px solid #3a3420;background:#1a1810;border-radius:3px;padding:2px 6px}
.luMgr{font-family:var(--mono);font-size:9px;color:var(--dim);margin-bottom:6px}
.luMgr b{color:var(--txt)}
.lu-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:1.5px 0;border-bottom:1px solid var(--hair2)}
.lu-row .lu-no{font-family:var(--mono);font-size:10px;color:var(--dim);width:18px;text-align:right}
.lu-tag{font-family:var(--mono);font-style:normal;font-size:8px;color:var(--amber);border:1px solid #3a3420;border-radius:2px;padding:0 3px;margin-left:auto}
.lu-bench{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:6px;line-height:1.6;border-top:1px solid var(--hair2);padding-top:5px}
.mpitch{position:relative;height:150px;border-radius:4px;background:linear-gradient(180deg,#2b6a3c,#256037);border:1px solid #1c4029;margin-bottom:8px;overflow:hidden}
.mpitch::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ffffff22}
.jm{position:absolute;transform:translate(-50%,-50%) scale(.3);opacity:0;transition:all .4s cubic-bezier(.2,.9,.3,1);text-align:center}
#seqLayer.reveal .jm{opacity:1;transform:translate(-50%,-50%) scale(1)}
.jm b{display:flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:3px;margin:0 auto;font-family:var(--mono);font-size:8px;color:#10130f;border:1px solid #0006}
.jm span{font-family:var(--mono);font-size:7px;color:#f0ead8;text-shadow:0 1px 2px #000;display:block;margin-top:1px;white-space:nowrap}
.motmCard{margin-top:14px;border-top:1px solid var(--hair);padding-top:10px;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(8px);transition:all .5s .1s}
.motmCard.in{opacity:1;transform:none}
.motmLab{font-size:9px;letter-spacing:.3em;color:var(--amber);text-transform:uppercase}
.motmStat{font-family:var(--mono);font-size:10px;color:var(--dim)}
.cta{padding:10px 26px;font-weight:600;font-size:14px;letter-spacing:.18em;text-align:center;color:var(--amber);cursor:pointer}
.cornchip{position:absolute;left:14px;bottom:14px;z-index:6;background:#101410e8;border:1px solid var(--hair);border-left:2px solid var(--amber);border-radius:4px;padding:7px 14px;font-family:var(--mono);font-size:11px;color:var(--txt);animation:chipIn .4s ease}
@keyframes chipIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    </style>
</head>

<body>
    <div id="app">
        <header>

                            '<div class="mf-row"><span>Fouls / Cards:</span><b>' + (p.m.fouls || 0) + ' / ' + (p.booked ? '1Y' : (p.m.yc ? p.m.yc + 'Y' : '0')) + '</b></div>' +
                            (p.isGK ? '<div class="mf-row"><span>Saves:</span><b>' + (p.m.saves || 0) + '</b></div>' : '<div class="mf-row"><span>Pressure:</span><b>' + p.press.toFixed(2) + '</b></div>') +
                        '</div>' +
                    '</div>' +
                '</div>';

            el.innerHTML =
                '<div class="insp-head"><b>' + p.name + '</b><span class="no">#' + p.no + '</span><span class="role">' + (p.slot ? p.slot.r : p.role) + '</span></div>' +
                '<div class="chips">' +
                '<span class="chip">OVR ' + (p.ovr || calcOVR(p)) + '</span>' +
                (p.arch ? '<span class="chip">' + p.arch + '</span>' : '') +
                '<span class="chip" style="color:#e2e8f0;border-color:#475569">FORM ' + p.form.toFixed(2) + '</span>' +
                '<span class="chip" style="color:#e2e8f0;border-color:#475569">MOR ' + p.morale.toFixed(2) + '</span>' +
                (p.slot ? '' : '<span class="chip" style="color:var(--faint)">BENCH</span>') +
                (p.ps.length ? p.ps.map(s => '<span class="chip">' + s + '</span>').join('') : '<span class="chip" style="color:var(--faint);border-color:var(--hair)">no playstyles</span>') + '</div>' +
                '<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:8px;margin:8px 0">' +
                    '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8">Active Tactical Intent</div>' +
                    '<div style="font-size:13px;font-weight:700;color:#e3b341;margin:2px 0">' + (it.label || it.type) + '</div>' +
                    '<div style="font-size:10px;color:#94a3b8">Team Phase: <b style="color:#e2e8f0">' + (T.phase || 'OPEN') + '</b> · Commit: <b style="color:#e2e8f0">' + rem.toFixed(1) + 's</b></div>' +
                '</div>' +
                matchFactsHtml +
                whyHtml +
                altHtml +
                '<div class="insp-state" style="margin-top:10px">ZONE <span style="color:#e3b341">' + zoneName(cT.x, cT.y) + '</span> · HOME <span style="color:#e3b341">' + zoneName(hT.x, hT.y) + '</span><br>PRESSURE <span style="color:#e07a45">' + p.press.toFixed(2) + '</span> · CTRL <span style="color:#e3b341">' + (p.ctrl !== undefined ? p.ctrl.toFixed(2) : '—') + '</span> · STAMINA <span>' + Math.round(p.stam) + '</span> · CONF ' + p.conf.toFixed(2) + (M.t < p.loanUntil ? ' · <span style="color:#e3b341">LOAN ' + (p.loanUntil - M.t).toFixed(1) + 's</span>' : '') + (p.booked ? ' · BOOKED' : '') + (M.t < p.fire ? ' · <span style="color:#f59e0b;font-weight:700">FIRED UP</span>' : '') + (M.t < p.rattled ? ' · <span style="color:#ef4444;font-weight:700">RATTLED</span>' : '') + ' · TEAM ' + T.phase + (M.poss === T ? ' · SPACE ' + spx.spaceLabel : ' · MARKING ' + (p.markingTarget ? p.markingTarget.name : '—')) + '</div>' +
                '<div class="attrgrid">' + bar('pace', p.attrs.pace) + bar('fin', p.attrs.fin) + bar('sPass', p.attrs.sPass) + bar('lPass', p.attrs.lPass) + bar('vis', p.attrs.vis) + bar('tck', p.attrs.tck) + bar('ints', p.attrs.ints) + bar('head', p.attrs.head) + (p.isGK ? bar('gkPos', p.attrs.gkPos) + bar('gkDiv', p.attrs.gkDiv) + bar('gkRef', p.attrs.gkRef) : bar('drib', p.attrs.drib) + bar('comp', p.attrs.comp)) + '</div>' +
                '<div class="note">risk ' + Math.round(p.pers.riskTolerance * 100) + ' · shot ' + Math.round(p.pers.shotAggression * 100) + ' · dribble ' + Math.round(p.pers.dribbleAggression * 100) + ' · run ' + Math.round(p.pers.runFrequency * 100) + ' · discipline ' + Math.round(p.pers.positionDiscipline * 100) + ' · commit ' + Math.round(p.pers.defensiveCommitment * 100) + '</div>';
        }
        cv.addEventListener('click', e => {
            const r = cv.getBoundingClientRect();
            const x = (e.clientX - r.left) * (cv.width / r.width) - RS.w / 2, y = (e.clientY - r.top) * (cv.height / r.height) - RS.h / 2;
            let best = null, bd = 3.2;
            for (const p of M.players) { if (p.off) continue; const d = hyp(p.pos.x - x / RS.k, p.pos.y - y / RS.k); if (d < bd) { bd = d; best = p } }
            UI.sel = best === UI.sel ? null : best; drawInspector();
        });
        /* main loop */
        let acc = 0, last = performance.now(), uiT = 0;
        function frame(now) {
            const dt = Math.min(0.1, (now - last) / 1000); last = now;
            if (!M) { requestAnimationFrame(frame); return }
            if (UI.fast) {
                if (CIN.seq) endSeq();
                $('simbar').style.display = 'block';
                let n = 0;
                try {
                    while (n < 2600 && M.phase !== 'FULL') { step(); n++ }
                } catch (err) {
                    console.error('Fast-forward simulation error:', err);
                    UI.fast = false;
                }
                $('simbar').firstElementChild.style.width = (M.half === 2 ? 50 + M.t / HALF * 50 : M.t / HALF * 50) + '%';
                if (M.phase === 'FULL') { UI.fast = false; $('simbar').style.display = 'none'; draw() }
                requestAnimationFrame(frame); return;
            }
            seqTick(dt);
            if (!UI.paused) {
                let paceMult = 1.0;
                if (M) {
                    if (M.t > HALF * 0.78) paceMult *= 0.85;
                    if (M.ball && Math.abs(M.ball.pos.x) > 28) paceMult *= 0.88;
                }
                acc += dt * UI.speed * paceMult; let n = 0;
                try {
                    while (acc >= DT && n < 10) { step(); acc -= DT; n++ }
                } catch (err) {
                    console.error('Simulation step error:', err);
                    acc = 0;
                }
                if (n >= 10) acc = 0;
                draw();
            } else draw();
            uiT -= dt; if (uiT <= 0) {
                uiT = 0.4;
                $('score').textContent = M.score[0] + ' : ' + M.score[1];
                $('clock').textContent = clockStr();
                $('halfTag').textContent = M.phase === 'FULL' ? 'FULL-TIME' : M.phase === 'STOPPAGE' ? 'STOPPAGE' : M.half === 1 ? '1ST HALF' : '2ND HALF';
                $('xgTop').innerHTML = 'xG <b>' + M.teams[0].stats.xg.toFixed(2) + '</b> · <b>' + M.teams[1].stats.xg.toFixed(2) + '</b>';
                $('nmH').textContent = M.teams[0].abbr; $('nmA').textContent = M.teams[1].abbr;
                $('kitH').style.background = M.teams[0].col; $('kitA').style.background = M.teams[1].col;
                drawStats(); drawInspector();
            }
            requestAnimationFrame(frame);
        }
        function boot(seed) {
            UI.sel = null; UI.trail = []; UI.feedN = 0; UI.fast = false; UI.paused = false;
            $('icPlay').innerHTML = '<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>';
            $('feed').innerHTML = ''; $('ftOverlay').classList.remove('show'); $('simbar').style.display = 'none';
            newMatch(seed); buildTacticsUI(); resize();
        }
        try { boot((Math.random() * 1e9) | 0) } catch (e) {
            document.getElementById('tkTxt').textContent = 'ENGINE ERROR: ' + e.message;
            console.error(e);
        }
        requestAnimationFrame(frame);
        window.__probe = { clean: 0, cleanShot: 0, cleanPass: 0, breach: 0, breachPress: 0, intTries: 0, intHits: 0, offPass: 0, width: 0, widthN: 0 };
        window.__sims = function (n = 5) {
            UI.quiet = true;
            const cinWas = UI.cin; UI.cin = false;
            window.__probe = { clean: 0, cleanShot: 0, cleanPass: 0, breach: 0, breachPress: 0, intTries: 0, intHits: 0, offPass: 0, width: 0, widthN: 0 };
            const A = { m: 0, goals: [0, 0], pass: [], acc: [], lob: [], shots: [], xg: [], fouls: [], corners: [], off: [], thr: [], yc: [], swarm: 0, checks: 0, og: 0, goalsAll: 0 };
            for (let i = 0; i < n; i++) {
                boot((Math.random() * 1e9) | 0);
                let guard = 0;
                while (M.phase !== 'FULL' && guard < 300000) {
                    step(); guard++;
                    if (guard % 300 === 0) {                       /* swarm invariant: >2 players on the ball */
                        A.checks++;
                        const c = M.players.filter(q => !q.off && q !== M.ball.owner && hyp(q.pos.x - M.ball.pos.x, q.pos.y - M.ball.pos.y) < 2.2).length;
                        if (c > 2) A.swarm++;
                    }
                }
                A.m++; A.goals[0] += M.score[0]; A.goals[1] += M.score[1];
                A.og += M.events.filter(e => e.type === 'goal' && e.og).length;
                A.goalsAll += M.score[0] + M.score[1];
                for (let ti = 0; ti < 2; ti++) {
                    const s = M.teams[ti].stats;
                    A.pass.push(s.passC); A.acc.push(s.passA ? s.passC / s.passA : 0);
                    A.lob.push(s.passA ? s.lobA / s.passA : 0);
                    A.shots.push(s.shots); A.xg.push(s.xg); A.fouls.push(s.fouls);
                    A.corners.push(s.corners); A.off.push(s.off); A.thr.push(s.thr); A.yc.push(s.yc);
                }
            }
            UI.quiet = false;
            UI.cin = cinWas;
            const avg = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
            const rep = {
                matches: A.m, score: A.goals.map(g => (g / A.m).toFixed(2)).join(' — '),
                passTeam: avg(A.pass).toFixed(0), shotsTeam: avg(A.shots).toFixed(1), xgTeam: avg(A.xg).toFixed(2),
                acc: (avg(A.acc) * 100).toFixed(1) + '%', lobShare: (avg(A.lob) * 100).toFixed(1) + '%',
                fouls: (avg(A.fouls) * 2).toFixed(1), corners: (avg(A.corners) * 2).toFixed(1),
                offsides: (avg(A.off) * 2).toFixed(1), throughBalls: (avg(A.thr) * 2).toFixed(1),
                swarmRate: A.checks ? (A.swarm / A.checks * 100).toFixed(1) + '%' : '—'
            };
            console.log('%c FP26 CALIBRATION — ' + A.m + ' matches ', 'background:#e3b341;color:#141104;font-weight:bold', rep);
            const tgt = (name, v, lo, hi) => { const nv = typeof v === 'string' ? parseFloat(v) : v; console.log((nv >= lo && nv <= hi ? '✔' : '✘') + ' ' + name + ': ' + v + ' (target ' + lo + '–' + hi + ')'); };
            tgt('passes/match (both teams)', (avg(A.pass) * 2).toFixed(0), 260, 480);
            tgt('shots/match (both teams)', (avg(A.shots) * 2).toFixed(1), 12, 20);
            tgt('offside passes / match', (window.__probe.offPass / A.m).toFixed(1), 0, 3);
            tgt('xG per team', avg(A.xg).toFixed(2), 0.8, 2.2);
            tgt('lofted share', (avg(A.lob) * 100).toFixed(1) + '%', 10, 15);
            tgt('fouls (both teams)', (avg(A.fouls) * 2).toFixed(1), 9, 20);
            tgt('yellows', (avg(A.yc) * 2).toFixed(1), 2, 5);
            tgt('offsides', (avg(A.off) * 2).toFixed(1), 1, 6);
            tgt('corners (both teams)', (avg(A.corners) * 2).toFixed(1), 4, 10);
            const ogRate = A.goalsAll ? (A.og / A.goalsAll * 100).toFixed(1) : '—';
            tgt('own-goal share', ogRate + '%', 0, 6);
            const P = window.__probe;
            tgt('through-on-goal shot rate', (P.cleanShot / Math.max(1, P.clean) * 100).toFixed(0) + '%', 78, 95);
            const avgWidth = P.widthN ? (P.width / P.widthN).toFixed(1) : 0;
            tgt('winger/FB width (possession)', avgWidth, 16, 22);
            tgt('breached ticks engaged', (P.breachPress / Math.max(1, P.breach) * 100).toFixed(0) + '%', 92, 100);
            const totalPassTries = A.pass.reduce((x, y) => x + y, 0) + P.intHits;
            tgt('intercepted-pass share', (P.intHits / Math.max(1, totalPassTries) * 100).toFixed(1) + '%', 8, 14);
            boot((Math.random() * 1e9) | 0);   /* hand back a live pitch */
            return rep;
        };
    </script>
